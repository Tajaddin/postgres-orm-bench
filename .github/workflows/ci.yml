name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # NOTE: PG_TEST_PASSWORD is a CI-only synthetic credential for the
    # ephemeral postgres service container below. It is not used by the
    # library, not exposed outside this workflow, and the container is
    # destroyed when the job ends. Do not reuse this value anywhere.
    env:
      PG_TEST_USER: postgres
      PG_TEST_PASSWORD: ci-only-not-secret
      PG_TEST_DB: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.PG_TEST_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_TEST_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_TEST_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (with the psycopg postgres extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Unit tests (SQLite smoke suite)
        run: pytest -q
      - name: Benchmark all 4 ORMs against Postgres 16
        env:
          ORM_BENCH_DSN: postgresql://${{ env.PG_TEST_USER }}:${{ env.PG_TEST_PASSWORD }}@localhost:5432/${{ env.PG_TEST_DB }}
        run: |
          orm-bench --records 800 --users 100 --iter 1 --out bench/ci-postgres.json
          echo "--- results ---"
          cat bench/ci-postgres.json
